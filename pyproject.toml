[project]
name = "wallabag-podcast"
version = "0.1.0"
description = "Queue-driven TTS web app: Wallabag articles narrated by Kokoro-FastAPI into a podcast RSS feed"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "mutagen>=1.47",
    "feedgen>=1.0",
    "jinja2>=3.1",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
