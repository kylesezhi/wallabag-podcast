<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kyle's Morning Podcast{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-logo" aria-hidden="true">&#9749;</span>
      <span class="brand-name">Kyle's Morning Podcast</span>
    </a>
    <nav class="site-nav">
      <a class="nav-gear" href="/settings" title="Settings" aria-label="Settings">&#9881;</a>
    </nav>
  </header>

  {% if message %}<div class="flash flash-message" role="status">{{ message }}</div>{% endif %}
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
