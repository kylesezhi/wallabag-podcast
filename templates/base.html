<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ feed_title }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-logo" aria-hidden="true">&#9749;</span>
      <span class="brand-name">{{ feed_title }}</span>
    </a>
    <nav class="site-nav">
      <a class="nav-gear" href="/settings" title="Settings" aria-label="Settings">&#9881;</a>
    </nav>
  </header>

  {% if message %}<div class="flash flash-message" role="status">{{ message }}</div>{% endif %}
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ static_url('js/app.js') }}" defer></script>
</body>
</html>
