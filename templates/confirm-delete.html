{% extends "base.html" %}
{% block title %}Remove Episode — {{ feed_title }}{% endblock %}
{% block content %}
<h1 class="page-title">Remove Episode</h1>
<div class="card confirm-card">
  <div class="modal-icon" aria-hidden="true"><span class="material-symbols-outlined">delete_outline</span></div>
  <p class="confirm-text">Remove <strong>{{ title }}</strong> from the podcast?</p>
  <p class="section-hint">The article stays unread in Wallabag.</p>
  <div class="confirm-actions">
    <form method="post" action="/queue/{{ episode_id }}/delete">
      <button type="submit" class="btn btn-stop">Remove</button>
    </form>
    <a class="confirm-cancel" href="/">Cancel</a>
  </div>
</div>
{% endblock %}
