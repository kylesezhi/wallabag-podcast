[tools]
python = "3.12"
uv = "0.5.9"

[tasks.start]
description = "Run the dev server (http://127.0.0.1:8000)"
run = '''
#!/usr/bin/env bash
if [ ! -f .env ]; then
    echo "No .env found — creating one from .env.example."
    echo "Fill in your Wallabag credentials, then re-run 'mise run start'."
    cp .env.example .env
    exit 1
fi
exec uv run uvicorn app.main:app --reload
'''

[tasks.test]
description = "Run the test suite"
run = "uv run pytest -q"