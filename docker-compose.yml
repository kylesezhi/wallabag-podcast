services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Reachable outside the container (the default binds to 127.0.0.1).
      HOST: "0.0.0.0"
      # Inside the compose network the TTS server is reached by service
      # name, not localhost (the .env default of http://localhost:8880
      # would fail).
      TTS_BASE_URL: "http://tts:8880"
    volumes:
      # Persist the SQLite DB and generated audio on the host.
      - ./data:/app/data
    depends_on:
      - tts
    restart: unless-stopped

  # Kyutai Pocket TTS (https://github.com/kyutai-labs/pocket-tts) — there is
  # no official prebuilt image, so this service builds from the repo's own
  # Dockerfile.tts: the pinned pocket-tts package with CPU-only torch from
  # the PyTorch CPU index (upstream's documented Linux approach — avoids the
  # ~3 GB of unused CUDA wheels PyPI's default torch bundles). The English
  # model downloads from Hugging Face on first start (several minutes) and is
  # cached in the named volumes below.
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    # Source of truth for the serve flags (mirrors the Dockerfile CMD so the
    # image also works standalone).
    command: ["serve", "--host", "0.0.0.0", "--port", "8880"]
    ports:
      - "8880:8880"
    volumes:
      - pocket_tts_cache:/root/.cache/pocket_tts
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  pocket_tts_cache:
  hf_cache:
